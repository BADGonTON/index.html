# Bitta buyruq bilan to'liq ishga tushirish:
#
#   cp .env.example .env     (va to'ldiring)
#   docker compose up -d
#   docker compose logs -f bot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hozirol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hozirol}
      POSTGRES_DB: hozirol
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hozirol -d hozirol"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Bazani tashqi dunyoga OCHMAYMIZ — faqat ichki tarmoq.
    expose:
      - "5432"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hozirol:${POSTGRES_PASSWORD:-hozirol}@db:5432/hozirol
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
